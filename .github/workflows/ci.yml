name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write # purge des anciens caches Nix

jobs:
  validate:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-devenv

      # Hooks git (vs-lint, nixfmt) sur tout le dépôt, puis enterTest
      # (vs-gen --check, vs-lint et contrôle du zip). devenv n'affiche la
      # sortie d'enterTest qu'en cas d'échec : les deux étapes suivantes
      # relancent ces contrôles pour qu'ils apparaissent dans le journal.
      - name: devenv test
        run: devenv test

      - name: Fichiers générés à jour (vs-gen --check)
        run: devenv shell -- vs-gen --check

      # vs-lint annote les lignes fautives dans la pull request.
      - name: Fichiers de langue (vs-lint)
        run: devenv shell -- vs-lint

      - name: Construire le zip
        run: devenv shell -- vs-build

      - name: Résumé
        run: |
          devenv shell -- vs-audit >audit.txt
          {
            echo "## vsopenfrench"
            echo
            echo "- Zip : \`$(basename dist/*.zip)\`"
            echo "- $(tail -n1 audit.txt | sed 's| -> .*||')"
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: vsopenfrench-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error

  server:
    name: Chargement en jeu
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-devenv

      # Serveur jetable en français avec le modpack de référence et le mod :
      # échoue si le jeu refuse un fr.json de ce dépôt.
      - name: vs-test
        run: devenv shell -- vs-test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: server-logs-${{ github.sha }}
          path: |
            work/server/Logs/
            work/server/stdout.log
